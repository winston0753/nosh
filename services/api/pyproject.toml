[project]
name = "nosh-api"
version = "0.1.0"
description = "Nosh FastAPI modular monolith"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "geoalchemy2>=0.15",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    # PyJWT[cryptography] provides RS256 JWKS verification and HS256 secret verification.
    "PyJWT[cryptography]>=2.8",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    "anyio>=4",
    "cryptography>=50.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.11",
    "freezegun>=1.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# Share a single event loop across the whole pytest session.
# This is required for session-scoped async fixtures (engine, committing_factory)
# to share one asyncpg connection pool without "Event loop is closed" errors
# when function-scoped tests create and discard loops between tests.
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "integration: requires a live database",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/places/fixtures.py" = ["E501"]
"app/suggestions/models.py" = ["E501"]
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
