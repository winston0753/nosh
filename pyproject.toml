[project]
name = "nosh"
version = "0.0.1"
description = "Proactive restaurant-exploration agent. Pre-design: brief, open questions, policy simulation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=8",
    "types-python-jose>=3.5.0.20260408",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
