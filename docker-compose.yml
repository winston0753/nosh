services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: nosh
      POSTGRES_PASSWORD: nosh_dev
      POSTGRES_DB: nosh_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nosh -d nosh_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  db_test:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: nosh
      POSTGRES_PASSWORD: nosh_dev
      POSTGRES_DB: nosh_test
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    profiles:
      - test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nosh -d nosh_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
